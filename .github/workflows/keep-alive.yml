name: Supabase keep-alive
on:
  schedule:
    - cron: '0 13 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://sxkmvlpzpkoiyvaowdyn.supabase.co
          SUPABASE_KEY: sb_publishable_xget8F5pAkCg0LyWsfUf-A_QhgcZWk-
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" "$SUPABASE_URL/rest/v1/meetings?select=id&limit=1" -H "apikey: $SUPABASE_KEY"
